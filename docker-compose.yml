# Local development server for the Paws Fur Thought website
#   http://localhost:8080
# Serves the built site/ folder. Run `python build.py --watch` alongside it so edits in src/ show on refresh.

name: pft-site

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
