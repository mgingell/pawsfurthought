# Behaves like typical static hosts (Netlify, Cloudflare Pages, GitHub Pages):
# /apply/ serves apply/index.html, unknown paths get 404.html. Caching off for development.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    error_page 404 /404.html;
}
